# cargo-audit configuration.
#
# Every entry here is a tracked exception: it must name the advisory, explain
# why the affected code path is not reachable, and say what removes it.

[advisories]
ignore = [
    # CVE-2026-119375: SQLite < 3.54.0 can return uninitialized page-cache
    # memory when it opens a database whose sibling -wal file declares a
    # different page size. The fix lives in libsqlite3-sys 0.39, but
    # sqlx-sqlite 0.9 requires `libsqlite3-sys < 0.38`, so the workspace cannot
    # upgrade yet.
    #
    # Exposure: only openvalut-server links SQLite, and it creates and owns its
    # database file. The attack needs a local attacker who can already write
    # next to that file, i.e. the same privileges that let them read the
    # database directly. The CLI and desktop clients never open SQLite.
    #
    # Remove when sqlx ships a release that accepts libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]
