org.gradle.jvmargs=-Xmx4G
# Local JDK used by the jvmToolchain(17) builds. Keep this machine-specific
# path here so a plain build does not need JAVA_HOME fiddling; CI machines
# still auto-detect their own JDKs.
org.gradle.java.installations.paths=/home/user/.local/jdk17

android.useAndroidX=true
android.enableJetifier=true
# No idea, this will crash on launch with:
# java.lang.IncompatibleClassChangeError: Class 'android.content.res.XmlBlock$Parser' does not implement interface 'j8.a' in call to 'int j8.a.next()' (declaration of 'z.b' appears in /data/app/design.codeux.openvalut-swqx9NIaYieBd8FrWYzciw==/base.apk)
android.enableR8.fullMode=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
