[package]
name = "openvalut-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenValut server: E2E-encrypted vault sync backend."

[dependencies]
openvalut-core = { path = "../openvalut-core" }

# Async / HTTP
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "postgres", "any", "migrate"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto / encoding
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
percent-encoding = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }

# Error / utils
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
