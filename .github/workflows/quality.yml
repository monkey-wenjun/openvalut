name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The desktop crate links GTK/WebKitGTK/Soup3 and libsecret at build
      # time, so the workspace cannot even be checked on a bare runner.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            liblzma-dev libsecret-1-dev libkeybinder-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  chrome-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chrome_extension/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome_extension/test/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openvalut
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Stable unit-test suite
        run: |
          flutter test \
            test/credential_server/credential_server_test.dart \
            test/password_strength_test.dart \
            test/utils/secret_reference_test.dart \
            test/openvalut_cloud/row_entry_codec_test.dart
