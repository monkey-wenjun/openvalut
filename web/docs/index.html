<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVault Docs</title>
  <meta name="description" content="OpenVault documentation rendered from README." />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .docs-hero {
      padding-top: 120px;
      padding-bottom: 48px;
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border-bottom: 1px solid var(--color-border);
    }
    .docs-hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 12px;
    }
    .docs-hero p {
      color: var(--color-text-secondary);
      margin: 0;
      font-size: 1.0625rem;
    }
    .docs-lang {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .docs-lang a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
    }
    .docs-lang a:hover,
    .docs-lang a.active {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background: #ecfdf5;
    }
    .docs-body {
      padding: 64px 0 96px;
      min-height: 50vh;
    }
    .docs-content {
      max-width: 800px;
      margin: 0 auto;
    }
    .docs-content h1,
    .docs-content h2,
    .docs-content h3,
    .docs-content h4 {
      color: var(--color-text);
      margin-top: 1.6em;
      margin-bottom: 0.6em;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .docs-content h1 { font-size: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
    .docs-content h2 { font-size: 1.5rem; }
    .docs-content h3 { font-size: 1.25rem; }
    .docs-content p,
    .docs-content li {
      color: var(--color-text-secondary);
      line-height: 1.75;
    }
    .docs-content ul,
    .docs-content ol {
      padding-left: 1.5em;
    }
    .docs-content li {
      margin-bottom: 0.4em;
    }
    .docs-content a {
      color: var(--color-primary);
      text-decoration: underline;
    }
    .docs-content a:hover {
      color: var(--color-primary-dark);
    }
    .docs-content code {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 0.875em;
      background: var(--color-surface);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--color-text);
    }
    .docs-content pre {
      background: #0f172a;
      color: #cbd5e1;
      padding: 16px;
      border-radius: var(--radius-lg);
      overflow-x: auto;
      line-height: 1.6;
    }
    .docs-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: 0.8125rem;
    }
    .docs-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      font-size: 0.9375rem;
    }
    .docs-content th,
    .docs-content td {
      border: 1px solid var(--color-border);
      padding: 10px 12px;
      text-align: left;
    }
    .docs-content th {
      background: var(--color-surface);
      font-weight: 600;
      color: var(--color-text);
    }
    .docs-content blockquote {
      border-left: 4px solid var(--color-primary);
      margin: 1.5em 0;
      padding: 8px 16px;
      background: #ecfdf5;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .docs-content blockquote p {
      margin: 0;
      color: var(--color-primary-dark);
    }
    .docs-content hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2em 0;
    }
    .docs-loading,
    .docs-error {
      text-align: center;
      padding: 64px 24px;
      color: var(--color-text-secondary);
    }
    .docs-error {
      color: #dc2626;
    }
    @media (max-width: 640px) {
      .docs-hero h1 { font-size: 1.75rem; }
      .docs-hero { padding-top: 100px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="../" class="logo">
        <img src="../logo.png" alt="OpenVault Logo" />
        <span>OpenVault</span>
      </a>
      <div class="nav-links">
        <a href="../en/">English</a>
        <a href="../zh/">简体中文</a>
        <a href="../zh-hant/">繁體中文</a>
      </div>
      <div class="nav-actions">
        <a href="https://github.com/your-org/openvalut" target="_blank" rel="noopener" class="btn btn-secondary btn-github">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span class="btn-text">GitHub</span>
        </a>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="mobile-menu">
      <div class="container">
        <a href="../en/">English</a>
        <a href="../zh/">简体中文</a>
        <a href="../zh-hant/">繁體中文</a>
        <a href="https://github.com/your-org/openvalut" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <section class="docs-hero">
    <div class="container">
      <h1>Documentation</h1>
      <p>Rendered from the project README.</p>
      <div class="docs-lang">
        <a href="?lang=zh" data-lang="zh">简体中文</a>
        <a href="?lang=en" data-lang="en">English</a>
      </div>
    </div>
  </section>

  <section class="docs-body">
    <div class="container docs-content">
      <div class="docs-loading" id="docs-loading">Loading documentation…</div>
      <div id="docs-root"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <a href="../" class="logo">
        <img src="../logo.png" alt="OpenVault Logo" />
        <span>OpenVault</span>
      </a>
      <div class="footer-copy">© 2026 OpenVault</div>
      <div class="footer-links">
        <a href="../">Home</a>
        <a href="https://github.com/your-org/openvalut" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../script.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var lang = params.get('lang') || 'zh';
      var readmePath = lang === 'en' ? '../../README_EN.md' : '../../README.md';

      document.querySelectorAll('.docs-lang a').forEach(function (a) {
        if (a.dataset.lang === lang) a.classList.add('active');
      });
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';

      fetch(readmePath)
        .then(function (res) {
          if (!res.ok) throw new Error('Unable to load README: ' + res.status);
          return res.text();
        })
        .then(function (md) {
          document.getElementById('docs-loading').style.display = 'none';
          document.getElementById('docs-root').innerHTML = marked.parse(md);
        })
        .catch(function (err) {
          document.getElementById('docs-loading').style.display = 'none';
          document.getElementById('docs-root').innerHTML =
            '<div class="docs-error">' + err.message + '</div>';
        });
    })();
  </script>
</body>
</html>
