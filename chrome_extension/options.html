<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenValut 设置</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon-192.png" alt="OpenValut" class="logo">
      <h1>OpenValut 设置</h1>
    </header>

    <div id="status" class="status"></div>

    <section class="section">
      <h2>使用方式</h2>
      <p class="hint">
        本扩展通过本地桥接读取桌面 OpenValut 已解锁的密码库，无需在此配置服务器或主密码。
        使用前请：安装 OpenValut Native Host，并在桌面端打开并解锁密码库。
      </p>
    </section>

    <section class="section">
      <h2>自动填充</h2>
      <label class="checkbox-label">
        <input type="checkbox" id="auto-fill-unique">
        唯一精确匹配时自动填充账号密码
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="auto-fill-totp">
        检测到 TOTP 输入框时自动填充验证码
      </label>
      <div class="actions" style="margin-top: 16px;">
        <button id="save-btn" class="primary">保存</button>
      </div>
    </section>
  </div>

  <script src="options.js"></script>
</body>
</html>
